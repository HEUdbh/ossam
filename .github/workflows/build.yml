name: ossam

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build: [
          {name: ossam, platform: linux/amd64, os: ubuntu-latest},
          {name: ossam, platform: windows/amd64, os: windows-latest},
          {name: ossam, platform: darwin/universal, os: macos-latest},
        ]
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend assets
        working-directory: frontend
        run: npm run build
      - uses: dAppServer/wails-build-action@main
        with:
          build: true
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          build-obfuscate: true
          package: false
          go-version: 1.25
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wails-build-${{ matrix.build.os }}
          path: build/bin/**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wails-build-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/**/*
